in":false},"content_type":"application/x-msdos-program","state":"uploaded","size":350137152,"digest":"sha256:2f3d5ace3f0061f2c975f7e38668ac50eb83deab403305b7b7f49a6c28f110e4","download_count":95,"created_at":"2026-11-28T04:25:25Z","updated_at":"2026-11-28T04:25:43Z"}],"body":"## What's New in v0.5.2\n\nFour weeks of fixes and one larger change: new sequence, swimlane and use case diagrams are laid out by the app, and in every other new diagram lines that ran through shapes are led around them. The desktop app moves to Electron 45.\n\n### New Features\n\n- **Layouts for sequence, swimlane and use case diagrams**: the model names the diagram's type and the app places lifelines, lanes and actors and leads the lines. Every other new diagram gets a repair: connectors through shapes are led around them, shapes on top of each other get room, and texts move to free places (#1072)\n- **Say why an answer was bad**: a thumbs down asks for the reason, and the vote row always shows under the latest answer (#1067)\n- **A crash page with a Report button** instead of a blank window, and a Report button on error messages (#1067)\n\n### Improvements\n\n- **A full check of the app with real model sessions** (#1070): Stop leaves a line with Retry, shapes you deleted stay deleted, Regenerate keeps your hand edits as a version, a language change keeps the page you were on, links typed into a message can be attached, exported .drawio files are readable, and SVG export keeps the page's background\n- **Old pictures are left out of later requests**, so a long chat with pictures no longer goes over the request size limit (#1066)\n- **OpenAI's own address uses the Responses API**, which GPT-5.5 and GPT-6 models need for tools with reasoning (#1066)\n\n### Bug Fixes\n\n- **Pictures sent to GPT-6 Luna on Amazon Bedrock** are scaled down to the picture data it takes, instead of failing with \"The provider returned an error\" (#1081)\n- **A PDF can be attached again** in Safari before 18.4 and Chrome before 122 (#1083)\n- **A clearer message when a model cannot read pictures** on OpenRouter, instead of \"model not found\" (#1066)\n- **Claude with thinking** no longer fails after a message with attachments (#1066)\n- **Empty files** are turned away when attached, instead of failing the request (#1066)\n\n### Security\n\n- **Dependencies**: Electron 45 (#1057), electron-builder 26.18 (#1052), zod 4.6.6 (#1042), Next.js 16.4.5 and eight more (#1063), minor and patch updates (#1056), Radix UI (#1055), `@hono/node-server` 2.1.8 (#1069)\n\n### MCP Server (0.4.8 to 0.4.15)\n\n- **DeepSeek Harness plugin** `@next-ai-drawio/dsh`, with the preview in DSH's sidebar (#1047, #1048); the preview link is repeated when the preview tab is not open (#1062)\n- **A trusted origin for the preview** behind a proxy or in a remote workspace (#1060 by @oliver-mee)\n- **Undo takes back the AI's last edit in one step** (#1049), and a drawing with containers is no longer taken for a hand edit (#1053)\n- The layouts and the repair of this release (#1072), the fixes of the full check (#1070), and a feedback link in the preview (#1067)\n- The preview API token is compared in constant time (#1079 by @ofri-peretz)\n\n### Developer Experience\n\n- The editor's actions go to Langfuse as a usage log when the server has it; the Google Analytics id is read at run time (#1071)\n- The MCP server is published to the official MCP registry with GitHub OIDC (#1054), after npm serves the new version (#1065); Biome 2.6.6 (#1051)\n\n### Documentation\n\n- Search titles and descriptions for the MCP page and the docs (#1061); IndexNow compares the pages' head tags in a fixed order (#1044)\n\n### Contributors\n\n- @DayuanJiang\n- @oliver-mee\n- @ofri-peretz\n\n### Downloads\n\n| Platform | File | Notes |\n|----------|------|-------|\n| macOS (Intel) | [Next-AI-Draw.io-0.5.2.dmg](https://github.com/DayuanJiang/next-ai-draw-io/releases/download/v0.5.2/Next-AI-Draw.io-0.5.2.dmg) | |\n| macOS (Apple Silicon) | [Next-AI-Draw.io-0.5.2-arm64.dmg](https://github.com/DayuanJiang/next-ai-draw-io/releases/download/v0.5.2/Next-AI-Draw.io-0.5.2-arm64.dmg) | |\n| Windows (Installer) | [Next.AI.Draw.io.Setup.0.5.2.exe](https://github.com/DayuanJiang/next-ai-draw-io/releases/download/v0.5.2/Next.AI.Draw.io.Setup.0.5.2.exe) | Recommended - installs to Program Files, auto-updates |\n| Windows (Portable) | [Next.AI.Draw.io.0.5.2.exe](https://github.com/DayuanJiang/next-ai-draw-io/releases/download/v0.5.2/Next.AI.Draw.io.0.5.2.exe) | No installation needed, just run |\n| Linux (AppImage) | [Next-AI-Draw.io-0.5.2.AppImage](https://github.com/DayuanJiang/next-ai-draw-io/releases/download/v0.5.2/Next-AI-Draw.io-0.5.2.AppImage) | |\n| Linux (deb) | [next-ai-draw-io_0.5.2_amd64.deb](https://github.com/DayuanJiang/next-ai-draw-io/releases/download/v0.5.2/next-ai-draw-io_0.5.2_amd64.deb) | |\n\n> ⚠️ **Note**: The app is not code-signed on macOS. You may see security warnings:\n> - **macOS**: \"App is damaged\" → Right-click the app → Open → Open, or run: `sudo xattr -rd com.apple.quarantine \"/Applications/Next AI Draw.io.app\"`\n> - **Windows**: Now code-signed with SignPath!\n\n---\n\n**Full Changelog**: https://github.com/DayuanJiang/next-ai-draw-io/compare/v0.5.1...v0.5.2\n","mentions_count":3}
